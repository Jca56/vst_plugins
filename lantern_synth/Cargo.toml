[package]
name = "lantern_synth"
version = "0.2.0"
edition = "2021"
authors = ["Alva"]
description = "Lantern — polyphonic subtractive synth with FM cross-mod for dubstep bass, resurrected on the zero-dep foundation"

[lib]
# rlib so native tools (face_preview, tests) can link the face and DSP.
crate-type = ["cdylib", "rlib"]

[dependencies]
lantern_ui = { path = "../lantern_ui" }
lantern_vst3 = { path = "../lantern_vst3" }

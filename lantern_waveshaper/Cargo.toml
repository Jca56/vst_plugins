[package]
name = "lantern_waveshaper"
version = "0.1.0"
edition = "2021"
authors = ["Alva"]
description = "Lantern Waveshaper — the saturation-to-distortion continuum with a clean sub split"

[lib]
# rlib so native tools (face_preview, tests) can link the face and DSP.
crate-type = ["cdylib", "rlib"]

[dependencies]
lantern_ui = { path = "../lantern_ui" }
lantern_vst3 = { path = "../lantern_vst3" }

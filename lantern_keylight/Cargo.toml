[package]
name = "lantern_keylight"
version = "0.1.0"
edition = "2021"
authors = ["Alva"]
description = "Lantern Keylight — tuner, pitch shifter, utility, and a scale cheat sheet for tuning samples into key"

[lib]
# rlib so native tools (face_preview) can link the face code.
crate-type = ["cdylib", "rlib"]

[dependencies]
lantern_ui = { path = "../lantern_ui" }
lantern_vst3 = { path = "../lantern_vst3" }
